site_name: SingleCellRNASignature Documentation

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - API Reference:
      - Dataset_Class: api/dataset_class.md
