[tool.poetry]
name = "singlecellrnasignature"
version = "0.1.0"
description = ""
authors = ["Lukas Jonathan Haeuser <lhaeuser@ethz.ch>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
datalair = {git = "git@github.com:LuJoHae/datalair.git", rev="4e06b15a45d3e2c2747e6e67fa61bc160cb9b2b3"}
polars = "^1.34.0"
anndata = "^0.12.2"
numpy = "^2.3.3"
pandas = "^2.3.3"
scipy = "^1.16.2"
scanpy = "^1.11.4"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
